version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nida_user
      POSTGRES_PASSWORD: nida_password
      POSTGRES_DB: nida_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nida_user:nida_password@db:5432/nida_chat
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./chroma_db:/app/chroma_db
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ./nida-chat-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
