version: '3.9'
services:
  api:
    build: .
    ports:
      - '8000:8000'
    volumes:
      - .:/app:cached
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  dashboard:
    build: .
    ports:
      - '8501:8501'
    volumes:
      - .:/app:cached
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    command: ["streamlit", "run", "social_listening/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]

  scheduler:
    build: .
    volumes:
      - .:/app:cached
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    command: ["python", "scripts/scheduler.py"]
